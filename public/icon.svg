<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0052FF"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="trophy-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#F7931A"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg-gradient)"/>
  
  <!-- Trophy icon -->
  <g transform="translate(106, 96)">
    <!-- Trophy cup -->
    <path d="M75 20h150v20c0 50-25 90-75 110-50-20-75-60-75-110V20z" fill="url(#trophy-gradient)"/>
    
    <!-- Trophy handles -->
    <path d="M75 40H40c0 40 20 60 35 60v-30c-10-5-15-15-15-30H75z" fill="url(#trophy-gradient)"/>
    <path d="M225 40h35c0 40-20 60-35 60v-30c10-5 15-15 15-30h-15z" fill="url(#trophy-gradient)"/>
    
    <!-- Trophy base -->
    <path d="M110 150h80v20h-80z" fill="url(#trophy-gradient)"/>
    <path d="M100 170h100v10c0 10-5 20-15 25H115c-10-5-15-15-15-25v-10z" fill="url(#trophy-gradient)"/>
    <path d="M90 205h120v15H90z" fill="url(#trophy-gradient)"/>
    
    <!-- Star decoration -->
    <path d="M150 60l10 20 22 3-16 16 4 22-20-10-20 10 4-22-16-16 22-3z" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Bottom text accent -->
  <text x="256" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="48" font-weight="800" fill="white" text-anchor="middle" opacity="0.95">PORTFOLIO</text>
  <text x="256" y="450" font-family="system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="white" text-anchor="middle" opacity="0.7">LEAGUE</text>
</svg>


